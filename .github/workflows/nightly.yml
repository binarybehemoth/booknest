name: Nightly audit

on:
  schedule:
    - cron: "*/15 * * * *"        # every 15 minutes while you watch; nightly: "30 2 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "5,35 * * * *"        # the same idea in UTC, twice an hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: npm audit --omit=dev --audit-level=high
      - run: echo "Audited $(date +%H:%M) $TZ for $EVENT $CRON"
        env:
          TZ: Asia/Kuala_Lumpur
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
