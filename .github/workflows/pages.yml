# Publishes the static front end, with a static copy of the catalog, to GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
    paths: ["public/**", db/seed.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build the site
        run: |
          mkdir -p _site/api
          cp public/* _site/
          node -p "JSON.stringify(require('./db/seed.json').books)" > _site/api/books
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
