# Audits BookNest's workflows with zizmor and uploads the findings to code scanning as SARIF.
name: Workflow audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/**"]
  pull_request:
    paths: [".github/workflows/**", ".github/actions/**"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows
        run: pipx run zizmor==1.30.1 --offline --format sarif .github > zizmor.sarif
      # github/codeql-action v4.38.2, pinned to its commit
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: zizmor.sarif
          category: zizmor
